name: Ledger

# Proves the SourceMint accounting invariant: every SRCMNT transfer out of a
# project wallet is recorded in rewards/ledger.json with a stated reason.
# Runs on every change and weekly, so an unaccounted movement turns this
# badge red in public.

permissions: {}

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    name: Verify on-chain accounting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ledger shape and published figures
        run: |
          python3 script/ledger_schema.py
          python3 -B -m unittest discover -s script -p 'test_*.py'
      - name: Verify ledger against Base mainnet
        env:
          # Snapshot headers and state use the primary RPC; token logs use
          # the logs RPC. Both endpoints must report the configured chain.
          BASE_RPC_URL: https://mainnet.base.org
          BASE_LOGS_RPC_URL: https://base.gateway.tenderly.co
          # Shared runner egress gets throttled where a laptop does not.
          BASE_RPC_MIN_INTERVAL: "0.25"
        run: |
          set +e
          python3 script/verify_ledger.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Ledger verified against Base mainnet."
            exit 0
          elif [ "$code" -eq 2 ]; then
            # Incomplete coverage is not an accounting finding. Every run
            # starts again from deployment and reports its actual coverage.
            echo "::warning title=Ledger not verified::History or snapshot could not be verified within source/resource limits; deferring."
            exit 0
          else
            echo "::error title=Accounting violation::A project-wallet movement is unaccounted for in rewards/ledger.json."
            exit 1
          fi
