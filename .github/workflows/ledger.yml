name: Ledger

# Proves the SourceMint accounting invariant: every SRCMNT transfer out of a
# project wallet is recorded in rewards/ledger.json with a stated reason.
# Runs on every change and weekly, so an unaccounted movement turns this
# badge red in public.

permissions: {}

on:
  push:
    branches: ["main"]
  # Pull requests cannot change on-chain state, so the ledger only needs
  # re-verifying when the PR touches the ledger itself.
  pull_request:
    paths:
      - "rewards/ledger.json"
      - "script/verify_ledger.py"
      - "script/fetch_rpc_transfers.py"
      - "script/block_windows.py"
      - "script/decode_transfer_fixture.py"
      - ".github/workflows/ledger.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    name: Verify on-chain accounting
    runs-on: ubuntu-latest
    # Deriving the full history from the chain is ~11,000 sequential
    # eth_getLogs calls, about two hours. Indexers make it seconds when they
    # answer; this budget is what independence from them costs.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ledger shape and published figures
        run: |
          python3 script/ledger_schema.py
          python3 -B -m unittest discover -s script -p 'test_ledger_schema.py'
      - name: Verify ledger against Base mainnet
        env:
          # Any public endpoint works. mainnet.base.org refuses eth_getLogs,
          # so it cannot carry the chain path on its own.
          BASE_RPC_URL: https://base.gateway.tenderly.co
          BASE_RPC_WINDOW: "1000"
        run: |
          set +e
          python3 script/verify_ledger.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Ledger verified against Base mainnet."
            exit 0
          elif [ "$code" -eq 2 ]; then
            # An indexer outage is not an accounting finding. Each run re-checks
            # the full transfer history, so a deferred check loses nothing.
            echo "::warning title=Ledger not verified::Transfer data source unreachable; deferring to the next run."
            exit 0
          else
            echo "::error title=Accounting violation::A project-wallet movement is unaccounted for in rewards/ledger.json."
            exit 1
          fi
