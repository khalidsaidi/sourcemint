name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  # Named for the status check main's branch protection requires. The
  # duplicate workflow deleted in c11b779 carried this job name; removing it
  # took the required context with it and nothing could merge afterwards.
  test:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Forge fmt (check)
        run: forge fmt --check
      - name: Forge test
        run: forge test -vvv
