name: Ledger offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test decoder and RPC adapter
        run: python3 -B -m unittest discover -s script -p 'test_*.py' -v
      - name: Test verifier integration and regressions
        run: python3 -B -m unittest discover -s test -p 'test_*.py' -v
