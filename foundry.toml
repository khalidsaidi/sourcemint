[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Allow scripts to write deployment JSON files to ./deployments
# (needed for vm.writeJson)
fs_permissions = [
  { access = "read-write", path = "./deployments" }
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
wrap_comments = true
