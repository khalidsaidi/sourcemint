steps:
  # Cloud Build checks out the repo for you; this ensures submodules are present.
  - name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        git submodule update --init --recursive

  # Use the official Foundry container to keep CI small and deterministic.
  - name: ghcr.io/foundry-rs/foundry:stable
    entrypoint: bash
    env:
      - HOME=/tmp
    args:
      - -lc
      - |
        set -euo pipefail
        WORKDIR="$(mktemp -d /tmp/sourcemint-ci-XXXXXX)"
        cp -R /workspace/. "$$WORKDIR/"
        cd "$$WORKDIR"

        if command -v make >/dev/null 2>&1; then
          make fmt
          git diff --exit-code
          make test
        else
          forge fmt --check
          forge test -vvv
        fi

options:
  logging: CLOUD_LOGGING_ONLY
